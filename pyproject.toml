[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsoc"
version = "0.1.0"
description = "SOC monitor and firewall for MCP-based AI agents"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "anthropic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6",
  "httpx>=0.27",
  "asyncssh>=2.14",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["common", "servers", "agent", "proxy", "siem", "api", "demo", "gateway", "analyzer", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
